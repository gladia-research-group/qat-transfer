hydra:
  searchpath:
    - file://${oc.env:PWD}/config
  sweep:
    dir: logs/config/experiments/vision/ilharco_timm_supervised/000_baselines/evaluate_pv_ptq
    subdir: ${model_name}/${dataset_name}/optim=adamw_lr=${lr}_wd=${wd}_ls=${ls}_wl=${wl}_mgn=${max_grad_norm}_bs=${batch_size}/seed=${seed}

model_name: ???
dataset_name: ???
batch_size: ???
lr: ???
wd: ???
ls: ???
wl: ???
max_grad_norm: ???
seed: ???
gpu: ???
# Training-budget multiplier, matching the finetune run being evaluated.
# 1.0 is the schedule this repo has always run.
epoch_mult: 1.0

limit_num_epochs: null
limit_num_batches: null
log_to_file: false

# Must match finetune_pv.py exactly — these knobs locate the checkpoint.
pv:
  skip_modules: ???                # list of child-module attribute names skipped during PV training, e.g. [head]
  bits: ???                        # int, must match training
  granularity: ???                 # "tensor" or "channel", must match training
  delta_decay: ???                 # float in [0, 1], must match training
  max_code_change_per_step: ???    # float in (0, 1], must match training
  trust_ratio: null                # float > 0, or null; must match training
  p_every: 1                       # must match training
  temperature: 0.0                 # must match training

# Evaluation-time PTQ. On a settled PV checkpoint this is a no-op by
# construction; the run records ptq_max_abs_weight_delta so that stops being an
# assumption. Set bits/granularity to match pv.* unless deliberately probing a
# mismatch.
ptq:
  skip_modules: ???  # list of child-module attribute names to exclude from PTQ, e.g. [head]
  bits: ???          # int
  granularity: ???   # "tensor" or "channel"
