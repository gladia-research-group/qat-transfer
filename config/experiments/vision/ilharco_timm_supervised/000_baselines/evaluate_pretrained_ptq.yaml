hydra:
  searchpath:
    - file://${oc.env:PWD}/config
  sweep:
    dir: logs/config/experiments/vision/ilharco_timm_supervised/000_baselines/evaluate_pretrained_ptq
    subdir: ${model_name}/${dataset_name}/seed=${seed}

model_name: ???
dataset_name: ???
batch_size: ???
seed: ???
gpu: ???
limit_num_batches: null
log_to_file: false

# Training hyperparameters used to locate the finetuned head checkpoint.
lr: ???
wd: ???
ls: ???
wl: ???
max_grad_norm: ???
# Training-budget multiplier, matching the finetune run being evaluated.
# 1.0 is the schedule this repo has always run.
epoch_mult: 1.0

limit_num_epochs: null

qat:
  skip_modules: ???  # list of child-module attribute names skipped during QAT, used to locate checkpoint
  bits: ???          # int
  granularity: ???   # "tensor" or "channel"

ptq:
  skip_modules: ???  # list of child-module attribute names to exclude from PTQ, e.g. [head]
  bits: ???          # int
  granularity: ???   # "tensor" or "channel"
