hydra:
  searchpath:
    - file://${oc.env:PWD}/config
  sweep:
    dir: logs/config/experiments/vision/ilharco_timm_supervised/000_baselines/evaluate_fp_awq
    subdir: ${model_name}/${dataset_name}/optim=adamw_lr=${lr}_wd=${wd}_ls=${ls}_wl=${wl}_mgn=${max_grad_norm}_bs=${batch_size}/seed=${seed}

model_name: ???
dataset_name: ???
batch_size: ???
lr: ???
wd: ???
ls: ???
wl: ???
max_grad_norm: ???
seed: ???
gpu: ???
# Evaluation split: "test" or "val". Defaulted, unlike the other path-affecting
# keys, so that every existing documented invocation keeps writing exactly where
# it always did; the value is recorded in the results JSON and, for anything
# other than test, in the output path.
split: test
# Training-budget multiplier, matching the finetune run being evaluated.
# 1.0 is the schedule this repo has always run.
epoch_mult: 1.0

limit_num_epochs: null
limit_num_batches: null
log_to_file: false

awq:
  skip_modules: ???      # list of child-module attribute names to exclude from AWQ, e.g. [head]
  bits: ???              # int
  granularity: ???       # "tensor" or "channel"
  num_calib_batches: 4   # training-split batches materialized for calibration
  n_grid: 20             # scale-search grid points; ratio=0 is plain RTN, so RTN is always in the search space
  clip: true             # official auto_clip stage (searches a shrunk clipping threshold)
