hydra:
  searchpath:
    - file://${oc.env:PWD}/config
  sweep:
    dir: logs/config/experiments/vision/ilharco_timm_supervised/007_gptq_transfer/qv_transfer_gptqv
    subdir: ${model_name}/seed=${target.seed}/gptq=bits=${gptq.bits}_gran=${gptq.granularity}_ncal=${gptq.num_calib_batches}

model_name: ???
batch_size: ???
eval_split: ???        # "val" or "test"
limit_num_batches: null
log_to_file: false
skip_existing: true    # skip a (pair, alpha) cell whose eval_results.json already exists (resume guard)

# Shared training hyperparameters used to locate the FP checkpoints (source and
# target) and the source GPTQ checkpoint materialized by compute_gptq_checkpoints.py.
lr: ???
wd: ???
ls: ???
wl: ???
max_grad_norm: ???

gpu: ???

source:
  dataset_names: ???       # list of source dataset names to iterate over internally
  seed: ???
  # Training-budget multiplier for this role's checkpoints.
  epoch_mult: 1.0
  limit_num_epochs: null   # null -> DATASET_NAME_TO_EPOCHS[dataset_name]

target:
  dataset_names: ???       # list of target dataset names to iterate over internally
  seed: ???
  # Training-budget multiplier for this role's checkpoints.
  epoch_mult: 1.0
  limit_num_epochs: null   # null -> DATASET_NAME_TO_EPOCHS[dataset_name]

qv:
  alphas: ???        # list of float scaling coefficients, e.g. [1.0]. alpha=0 is
                     # pointless here: acc(patched) at alpha=0 IS the recorded fp
                     # baseline (000_baselines).

# GPTQ configuration of the DONOR checkpoints (locates the gptq/ checkpoint tree
# written by compute_gptq_checkpoints.py, and is recorded in results). NO
# quantizer is applied after patching in this phase.
gptq:
  skip_modules: ???        # list of child-module attribute names GPTQ skipped, e.g. [head]
  bits: ???                # int
  granularity: ???         # "tensor" or "channel"
  num_calib_batches: 4     # calibration knob of the materialized donor checkpoints
  percdamp: 0.01
  actorder: false
  block_size: 128          # result-invariant; NOT in any path fragment
