hydra:
  searchpath:
    - file://${oc.env:PWD}/config
  sweep:
    dir: logs/config/experiments/text/ilharco_automodelforsequenceclassification/000_baselines/evaluate_fp_gptq
    subdir: ${sanitize_hf:${model_name}}/${dataset_name}/optim=adamw_lr=${lr}_wd=${wd}_ls=${ls}_mgn=${max_grad_norm}_bs=${batch_size}_ml=${max_length}/seed=${seed}

model_name: ???
dataset_name: ???
batch_size: ???
lr: ???
wd: ???
ls: ???
max_grad_norm: ???
max_length: ???
seed: ???
gpu: ???
# Training-budget multiplier, matching the finetune run being evaluated.
# 1.0 is the schedule this repo has always run.
epoch_mult: 1.0

limit_num_epochs: null
limit_num_batches: null
log_to_file: false

gptq:
  skip_modules: ???      # list of child-module names to exclude from GPTQ, e.g. [classifier]
  bits: ???              # int
  granularity: ???       # "tensor" or "channel"
  num_calib_batches: 4   # training-split batches materialized for calibration
  percdamp: 0.01         # Hessian damping, fraction of mean diagonal
  actorder: false        # activation-order column permutation
  block_size: 128        # solver batching only; result-invariant, never in the output path
