hydra:
  searchpath:
    - file://${oc.env:PWD}/config
  sweep:
    dir: logs/config/experiments/text/ilharco_automodelforsequenceclassification/000_baselines/evaluate_qat_ptq
    subdir: ${sanitize_hf:${model_name}}/${dataset_name}/optim=adamw_lr=${lr}_wd=${wd}_ls=${ls}_mgn=${max_grad_norm}_bs=${batch_size}_ml=${max_length}/seed=${seed}

model_name: ???
dataset_name: ???
batch_size: ???
lr: ???
wd: ???
ls: ???
max_grad_norm: ???
max_length: ???
seed: ???
gpu: ???
# Training-budget multiplier, matching the finetune run being evaluated.
# 1.0 is the schedule this repo has always run.
epoch_mult: 1.0

limit_num_epochs: null
limit_num_batches: null
log_to_file: false

qat:
  skip_modules: ???  # list of child-module names skipped during QAT, e.g. [classifier]
  bits: ???          # int, must match training
  granularity: ???   # "tensor" or "channel", must match training

ptq:
  skip_modules: ???  # list of child-module names to exclude from PTQ, e.g. [classifier]
  bits: ???          # int
  granularity: ???   # "tensor" or "channel"
